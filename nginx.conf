server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://api:5050;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
  # mp4 is served as video/mp4. Nginx answers Range with 206 and Accept-Ranges.
  location ~* \.mp4$ {
    types { }
    default_type video/mp4;
    add_header Accept-Ranges bytes;
  }
}
