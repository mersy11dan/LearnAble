openapi: 3.0.3
info:
  title: LearnAble transcript API
  version: 0.2.0
  description: |
    Captions, translation, ASL gloss, speech recognition, image description, braille, and certificate checks.
    External providers are called only when X-LearnAble-Consent is yes and a key is set.
    facebook/nllb-200-distilled-600M is CC-BY-NC-4.0. It is not the default. Set HF_MT_MODEL yourself if you accept that licence.
    POST /api/gloss returns gloss precomputed by Suyash2205/signbridge-t5-base-asl-gloss for the sample lesson. The model card says Apache-2.0. Its training set, achrafothman/aslg_pc12, is CC-BY-NC-4.0, so the weights stay opt-in. Set LEARNABLE_GLOSS_LOCAL=1 to run them on this machine. Set HF_GLOSS_REMOTE=1 plus HF_TOKEN, and send the consent header, to call the Hugging Face Inference API. Amharic text is not glossed.
servers:
  - url: http://127.0.0.1:5050
paths:
  /api/health:
    get:
      summary: Which providers are configured
      responses:
        "200":
          description: Booleans only. Secrets are not returned.
  /api/translate:
    post:
      summary: Translate between English and Amharic
      parameters:
        - $ref: "#/components/parameters/Consent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, source, target]
              properties:
                text: { type: string }
                source: { type: string, enum: [en, am] }
                target: { type: string, enum: [en, am] }
      responses:
        "200":
          description: A translation or a sample caption. source is sample, hasab, huggingface, or unavailable.
        "400":
          description: Missing text or language.
  /api/gloss:
    post:
      summary: English caption to ASL gloss
      description: |
        Known lesson captions return the shipped precomputed gloss and do not load the model.
        Amharic is refused. Unknown English uses a local transformers model only when LEARNABLE_GLOSS_LOCAL is set.
        A remote Hugging Face call happens only when HF_GLOSS_REMOTE and HF_TOKEN are set and X-LearnAble-Consent is yes.
        The output is ASLG-PC12 gloss (English word order), not Ethiopian Sign Language.
      parameters:
        - $ref: "#/components/parameters/Consent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                language: { type: string, enum: [en, am] }
      responses:
        "200":
          description: gloss is the model string, or null. corrected is the hand-edited line for the sample lesson. source is precomputed, model, huggingface, or unavailable.
        "400":
          description: Missing English text.
  /api/transcribe:
    post:
      summary: Speech to text
      parameters:
        - $ref: "#/components/parameters/Consent"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio: { type: string, format: binary }
      responses:
        "200":
          description: Without a file, the demo lesson transcript. With a file and no key, nothing is invented.
  /api/describe-image:
    post:
      summary: Image description for alt text
      parameters:
        - $ref: "#/components/parameters/Consent"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary }
      responses:
        "200":
          description: The lesson picture description, or a model caption when a token and consent are present.
  /api/speak:
    post:
      summary: Optional Hasab speech
      parameters:
        - $ref: "#/components/parameters/Consent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                language: { type: string, enum: [en, am] }
      responses:
        "200":
          description: Audio bytes when Hasab is configured and consent is given. Otherwise JSON telling the page to use the device voice.
  /api/chat:
    post:
      summary: Answer a support question with Gemini, or say that a saved answer is shown
      parameters:
        - $ref: "#/components/parameters/Consent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                context: { type: string, description: Course notes the page already matched to the question }
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
      responses:
        "200":
          description: source gemini with a reply when GEMINI_API_KEY is set and consent was sent. Otherwise source saved with reply null, and the page shows its saved answer.
        "403":
          description: A key is set but the consent header is missing. Nothing was sent to Google.
  /api/sign-video:
    post:
      summary: Read a short ASL sign video, or say that recognition is unavailable
      description: |
        Off unless LEARNABLE_SIGN_VIDEO=1. This build does not download Torch, Ollama, or a Hugging Face sign model.
        The label is computer-generated ASL, not Ethiopian Sign Language. Files over 1.5 MB are refused.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [video]
              properties:
                video: { type: string, format: binary }
      responses:
        "200":
          description: source unavailable, text null, and an honest message. No model was downloaded.
        "400":
          description: No video was sent.
        "413":
          description: The video is over 1.5 MB.
  /api/braille:
    post:
      summary: Points at the browser braille exporter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                language: { type: string, enum: [en, am] }
      responses:
        "200":
          description: The widget writes the .brf file. This route confirms the text was accepted.
  /api/offline-pack:
    get:
      summary: Where the 3G pack is built
      responses:
        "200":
          description: The pack is built in the browser from /packs/demo so a phone can save it.
  /api/issuer:
    get:
      summary: Open Badges issuer profile and public key
      responses:
        "200":
          description: Profile JSON with an Ed25519 public JWK. The private key is not returned.
  /api/credentials:
    post:
      summary: Issue an Open Badges 3.0 credential
      description: |
        Signs an OpenBadgeCredential as a VC-JWT with Ed25519.
        displayName is stored only when consent is true. Otherwise the subject is a random pseudonymous id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId]
              properties:
                courseId: { type: string }
                displayName: { type: string }
                consent: { type: boolean }
      responses:
        "201":
          description: The new credential id, a /verify link, the VC-JWT, and the credential JSON.
        "400":
          description: Missing or unknown courseId.
  /api/credentials/{id}:
    get:
      summary: Fetch one credential
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: The credential JSON, the VC-JWT, issuedAt, and revoked.
        "404":
          description: No credential with that id.
  /api/credentials/{id}/verify:
    get:
      summary: Check the signature and revocation state
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: valid, issuedAt, issuer, and revoked.
        "404":
          description: No credential with that id. valid is false.
  /api/credentials/{id}/revoke:
    post:
      summary: Revoke a credential
      description: Disabled unless LEARNABLE_ADMIN_TOKEN is set. Send that token as Authorization Bearer.
      parameters:
        - $ref: "#/components/parameters/CredentialId"
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The credential is revoked.
        "403":
          description: Revocation is disabled, or the admin token was not accepted.
        "404":
          description: No credential with that id.
  /api/certificates/verify:
    post:
      summary: Check an Open Badges 3.0 credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: object }
      responses:
        "200":
          description: valid true or false, with the learner name when the proof matches.
components:
  parameters:
    CredentialId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Consent:
      name: X-LearnAble-Consent
      in: header
      required: false
      schema: { type: string, enum: ["yes"] }
      description: Required before any call leaves the host for Hasab or Hugging Face.
